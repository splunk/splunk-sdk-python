name: Set up SDK environment
description: Perform all the shared setup steps

inputs:
  deps-group:
    description: Dependency groups passed to `uv sync --group`
    required: true
    default: dev

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.13
        activate-environment: true
        enable-cache: true
        cache-python: true
    - name: Install dependencies from ${{ inputs.deps-group }} deps group
      env:
        SDK_DEPS_GROUP: ${{ inputs.deps-group }}
      shell: bash
      run: make ci-install
