name: Python SDK CD
on:
  push:
    branches: [develop]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-distributables:
    name: Build release distributables
    # We separate building from publishing, as poisoned build deps could
    # take advantage of escalated privileges during publishing. More info:
    # https://github.com/pypa/gh-action-pypi-publish/issues/217#issuecomment-1965727093
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-sdk-environment
        with:
          deps-group: release
      - name: Set pre-release version
        if: startsWith(github.ref, 'refs/tags/') == false
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_BASE="$(uv version --short)"
          uv version "${VERSION_BASE}.dev${RUN_NUMBER}"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/') == true
        env:
          VERSION_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ ${VERSION_TAG} != $(uv version --short) ]] && {
            printf "To prevent pre-releases being versioned incorrectly, \
          target package version needs to be set in pyproject.toml first.\n"
            exit 1
          }
          uv version "${VERSION_TAG}"
      - name: Get current version
        id: get-version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Build packages for distribution
        run: make build
      - name: Run AppInspect
        if: startsWith(github.ref, 'refs/tags/') == true
        uses: $/.github/actions/run-appinspect
      - name: Upload distributables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splunk-sdk-${{ steps.get-version.outputs.version }}
          path: dist/
      - name: Generate API reference
        run: make docs-zip
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-docs
          path: docs/_build/splunk-sdk-python-docs.zip

  publish-pre-release:
    name: Publish pre-release to Test PyPI
    if: startsWith(github.ref, 'refs/tags/') == false
    needs: build-distributables
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC-based trusted publishing to PyPI
    environment:
      name: splunk-test-pypi
      url: https://test.pypi.org/project/splunk-sdk/
    steps:
      - name: Download distributables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splunk-sdk-${{ needs.build-distributables.outputs.version }}
          path: dist/
      - name: Publish packages to Test PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  create-github-pre-release:
    if: startsWith(github.ref, 'refs/tags/') == false
    needs: [build-distributables, publish-pre-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: splunk-sdk-${{ needs.build-distributables.outputs.version }}
          path: ${{ env.DIST_DIR }}
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-distributables.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          DIST_GLOB: ${{ env.DIST_DIR }}*
        run: |
          gh release create "v${VERSION}" \
            --prerelease \
            --title "v${VERSION}" \
            --notes "Automated pre-release from run ${RUN_NUMBER}." \
            ${DIST_GLOB}

  publish-release:
    name: Publish release to PyPI
    if: startsWith(github.ref, 'refs/tags/') == true
    needs: build-distributables
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC-based trusted publishing to PyPI
    environment:
      name: splunk-pypi
      url: https://pypi.org/project/splunk-sdk/
    steps:
      - name: Download distributables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: splunk-sdk-${{ needs.build-distributables.outputs.version }}
          path: dist/
      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
