name: Python SDK CI
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [3.9]
        splunk-version: [9.4, latest]
        include:
          - os: ubuntu-latest
            python-version: 3.13
            splunk-version: latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-sdk-environment
        with:
          python-version: ${{ matrix.python-version }}
          deps-group: test
      - name: Launch Splunk Docker instance
        run: SPLUNK_VERSION=${{ matrix.splunk-version }} docker compose up -d
      - name: Set up .env
        run: cp .env.template .env
      - name: Restore pytest cache
        if: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .pytest_cache
          key: pytest-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pytest-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-
      - name: Run unit tests
        run: make test-unit
      - name: Run integration/system tests
        run: make test-integration
