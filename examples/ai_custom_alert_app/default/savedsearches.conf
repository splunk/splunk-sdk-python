[Threat Level Assessment]
description = Triggers when a source IP generates more than 10 events targeting a single destination.

search = index="main" sourcetype="ai_custom_alert_app:threat_log" | spath | where isnotnull(src_ip) AND isnotnull(dest_ip) | stats count AS event_count values(action) AS actions BY src_ip, dest_ip

dispatch.earliest_time = -15m
dispatch.latest_time = now

; Set to 1 to enable the alert
enableSched = 0
; Runs every minute
cron_schedule = */1 * * * *

counttype = number of events
relation = greater than
quantity = 10

alert.track = 1
alert.suppress = 0
alert.severity = 3

action.threat_level_assessment = 1
action.threat_level_assessment.param.output_index = main
action.threat_level_assessment.param.output_sourcetype = assessment
