[project.urls]
homepage = "https://pypi.org/project/splunk-sdk"
source = "https://github.com/splunk/splunk-sdk-python.git"
download = "https://github.com/splunk/splunk-sdk-python/releases/latest"
changelog = "https://github.com/splunk/splunk-sdk-python/releases"
documentation = "https://docs.splunk.com/Documentation/PythonSDK"
issues = "https://github.com/splunk/splunk-sdk-python/issues"

[project]
name = "splunk-sdk"
version = "3.0.1a0"
description = "Splunk Software Development Kit for Python"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Splunk, Inc.", email = "devinfo@splunk.com" }]
keywords = ["splunk", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 6 - Mature",
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = []

# https://github.com/astral-sh/uv/issues/8981#issuecomment-2466787211
# Treat the same as NPM's `dependencies`
[project.optional-dependencies]
compat = ["six>=1.17.0"]
ai = ["httpx==0.28.1", "langchain>=1.2.18", "mcp>=1.27.1", "pydantic>=2.13.4"]
anthropic = ["splunk-sdk[ai]>=3.0.0", "langchain-anthropic>=1.4.3"]
openai = ["splunk-sdk[ai]>=3.0.0", "langchain-openai>=1.2.1"]
google = [
  "splunk-sdk[ai]>=3.0.0",
  "langchain-google-genai==4.2.5",
  "google-auth>=2.52.0",
]

# Treat the same as NPM's `devDependencies`
[dependency-groups]
test = [
  "splunk-sdk[openai, anthropic, google]>=3.0.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-asyncio>=1.3.0",
  "python-dotenv>=1.2.2",
  "vcrpy>=8.1.1",
]
release = ["build>=1.5.0", "jinja2>=3.1.6", "sphinx>=9.1.0", "twine>=6.2.0"]
lint = [
  "basedpyright>=1.39.4",
  "ruff>=0.15.12",
  "mbake>=1.4.6",
  "zizmor==1.25.2",
]
dev = [
  "rich>=15.0.0",
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "release" },
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "splunklib",
  "splunklib.modularinput",
  "splunklib.searchcommands",
  "splunklib.ai",
  "splunklib.ai.core",
  "splunklib.ai.engines",
]

[tool.pytest.ini_options]
markers = ["app: requires sdk-app-collection", "smoke: essential smoke tests"]
junit_family = "xunit2"

[tool.coverage.run]
omit = ["docs/*", "tests/*", "examples/*", "scripts/*"]

[tool.basedpyright]
exclude = [".venv"]
allowedUntypedLibraries = ["splunklib"]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnusedCallResult = false

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 100

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  "ANN", # flake-8-annotations
  "B",   # flake8-bugbear
  "C4",  # comprehensions
  # "DOC", # pydocstyle
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "PT",  # flake-8-pytest-rules
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
ignore = [
  "E501", # line-length
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
