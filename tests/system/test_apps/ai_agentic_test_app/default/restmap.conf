[script:agentic_app-agent-name]
match           = /agentic_app/agent-name
scripttype      = python
handler         = agentic_endpoint.AgentNameHandler
python.required = 3.13

[script:indexes]
match           = /agentic_app/indexes
scripttype      = python
handler         = indexes.IndexesHandler
python.required = 3.13

[script:mcp_file_exists]
match           = /agentic_app/has_mcp_app_file
scripttype      = python
handler         = mcp_app_file_exists.Handler
python.required = 3.13
